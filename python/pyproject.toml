[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfgen"
version = "0.1.1"
description = "Python bindings for pdfgen, loading the C ABI library through ctypes"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["pdfgen"]
