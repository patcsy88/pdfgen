[workspace]
resolver = "2"
members = ["core", "ffi"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

# Debug builds deflate at about 9 MB/s, which makes the content-cap test and the fuzz tests slow.
[profile.dev.package.miniz_oxide]
opt-level = 3
